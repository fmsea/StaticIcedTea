---
name: Run Project Test Suite

on:
  push:
    branches: '*'
  pull_request:
    branches:
      - $default-branch

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3
      - name: Setup JDK 11 for x64
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          architecture: 'x64'
          cache: 'maven'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install z3 libz3-java
      - name: Install Z3 Jar
        run: |
          mvn --batch-mode install:install-file \
          -Dfile=/usr/share/java/com.microsoft.z3.jar \
          -DgroupId=com.microsoft \
          -DartifactId=z3 \
          -Dversion=4.8.12 \
          -Dpackaging=jar \
          -DgeneratePom=true
      - name: Build Project
        run: mvn --batch-mode verify -Dtest=!*ComparativeTest
        env:
          LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}:/usr/lib/x86_64-linux-gnu/jni/
