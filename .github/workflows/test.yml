---
name: Run Project Test Suite

on:
  push:
    branches: '*'
  pull_request:
    branches:
      - $default-branch

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      NO_COLOR: 1
    steps:
      - uses: actions/checkout@v4
      - name: Guix Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/guix
          key: guix-cache-${{ github.sha }}
          restore-keys: |
            guix-cache-
      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          channels: |-
            (list
             (channel
              (name 'guix)
              (url "https://codeberg.org/guix/guix")
              (branch "master")
              (commit "28bc0e870b4d48b8e3e773382bb0e999df2e3611")
              (introduction
               (make-channel-introduction
                "9edb3f66fd807b096b48283debdcddccfea34bad"
                 (openpgp-fingerprint
                  "BBB0 2DDF 2CEA F6A8 0D1D  E643 A2A0 6DF2 A33A 54FA")))))
      - name: Ensure no locale warning
        run: test -z "$(guix --version 2>&1 >/dev/null)"
      - name: Install Z3 Jar
        run: guix shell -m manifest.scm -- mvn --batch-mode clean
      - name: Build Project
        run: guix shell -m manifest.scm -- mvn --batch-mode package
        env:
          LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}:/usr/lib/x86_64-linux-gnu/jni/
